name: Build Windows Executable

on:
  push:
    branches: [main]
  workflow_dispatch: # Te permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      # Si tu proyecto usa Maven:
      - name: Compilar con Maven
        run: mvn clean package

      # O si es un proyecto simple sin Maven/Gradle, puedes compilarlo manualmente así:
      # - name: Compilar manualmente
      #   run: |
      #     mkdir bin
      #     javac -d bin $(Get-ChildItem -Recurse -Filter *.java | Select-Object -ExpandProperty FullName)

      - name: Subir artefacto (Ejecutable)
        uses: actions/upload-artifact@v4
        with:
          name: Compilador-Windows
          path: target/*.jar
