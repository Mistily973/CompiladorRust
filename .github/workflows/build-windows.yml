name: Build Windows Executable

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Compilar proyecto Java completo
        run: |
          New-Item -ItemType Directory -Force -Path bin
          $files = (Get-ChildItem -Recurse -Filter *.java).FullName
          javac -d bin $files

      - name: Crear JAR ejecutable
        run: |
          echo "Main-Class: Main.Main" > manifest.txt
          jar cfm Compilador.jar manifest.txt -C bin .

      - name: Subir artefacto (Ejecutable)
        uses: actions/upload-artifact@v4
        with:
          name: Compilador-Windows
          path: Compilador.jar
